name: Formula Studio Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: formula-studio-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-auth:
    name: Browser auth tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run deterministic browser harness
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node harness.js

  postgres-rls:
    name: PostgreSQL RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Add bundled PostgreSQL tools to PATH
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Run isolated authorization tests
        run: ./tests/run-sql-tests.sh
