# -Duser.language/-Duser.country: the zip writer in AGP (apkzlib) reads the year
# from the default calendar; on a Thai-locale Mac that is the Buddhist year
# (2569) which overflows the MS-DOS date range and crashes mergeJavaResource.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
